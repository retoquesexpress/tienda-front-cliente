<section class="precios">
  <div class="content">
    <h2>Precio de los servicios</h2>

    <ul class="price-list">
      @for (precio of precios; track $index) {
      <li>
        <span class="service">{{ precio.servicio }}</span>
        <span class="price">{{ precio.precio }}</span>
      </li>
      }
    </ul>
  </div>
</section>
