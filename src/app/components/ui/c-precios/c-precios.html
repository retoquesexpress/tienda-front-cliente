<section class="precios">
  <div class="precios__content">
    <h2 class="precios__title">Precio de los servicios</h2>

    <ul class="precios__list">
      @for (precio of precios; track $index) {
      <li class="precios__item">
        <span class="precios__service">{{ precio.servicio }}</span>
        <span class="precios__price">{{ precio.precio }}</span>
      </li>
      }
    </ul>
  </div>
</section>
